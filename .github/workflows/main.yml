name: Construire le mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1
      - name: Decompresser le projet
        run: unzip -o blackclover-mod.zip
      - name: Compiler le mod
        working-directory: blackclover-mod
        run: gradle build --no-daemon
      - name: Verifier que le mod n'est pas vide
        run: unzip -l blackclover-mod/build/libs/*.jar | grep BlackCloverMod.class
      - name: Envoyer le .jar
        uses: actions/upload-artifact@v4
        with:
          name: blackclover-mod-jar
          path: blackclover-mod/build/libs/*.jar
